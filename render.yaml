services:
  - type: web
    name: alphagenome-analytics-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: ANALYSIS_PERSISTENCE
        value: "false"
      - key: CORS_ORIGINS
        value: https://alphagenome-analytics-ui.onrender.com,https://alphagenome-analytics.vercel.app
      - key: ALPHAGENOME_API_KEY
        sync: false

  - type: web
    name: alphagenome-analytics-ui
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://alphagenome-analytics-api.onrender.com
      - key: NEXT_PUBLIC_MAX_BATCH_SIZE
        value: "100"
